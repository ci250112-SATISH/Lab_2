<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 25px; color: #222; }
    form { max-width: 520px; margin: 20px auto; padding: 24px; background: white; border: 1px solid #ccd2d8; border-radius: 8px; }
    h1 { text-align: center; color: #19324d; font-size: 25px; }
    label, .group-title { display: block; margin-top: 14px; margin-bottom: 6px; font-weight: bold; }
    input[type="text"], input[type="email"], input[type="number"], select, textarea { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #999; border-radius: 4px; }
    .choice { display: block; margin: 7px 0; font-weight: normal; }
    .buttons { margin-top: 18px; }
    button { padding: 9px 15px; margin-right: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <form action="#" method="get">
    <h1>Conference Registration Form</h1>

    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email address" required>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="18" max="99" value="18" required>

    <span class="group-title">Gender:</span>
    <label class="choice"><input type="radio" name="gender" value="Male"> Male</label>
    <label class="choice"><input type="radio" name="gender" value="Female"> Female</label>

    <label for="country">Country of Residence:</label>
    <select id="country" name="country">
      <option value="Malaysia" selected>Malaysia</option>
      <option value="Singapore">Singapore</option>
      <option value="Indonesia">Indonesia</option>
      <option value="Thailand">Thailand</option>
      <option value="Other">Other</option>
    </select>

    <span class="group-title">Areas of Interest:</span>
    <label class="choice"><input type="checkbox" name="interest" value="Software Development"> Software Development</label>
    <label class="choice"><input type="checkbox" name="interest" value="Data Science"> Data Science</label>
    <label class="choice"><input type="checkbox" name="interest" value="Cybersecurity"> Cybersecurity</label>
    <label class="choice"><input type="checkbox" name="interest" value="Artificial Intelligence"> Artificial Intelligence</label>

    <span class="group-title">Experience Level:</span>
    <label class="choice"><input type="radio" name="experience" value="Beginner"> Beginner</label>
    <label class="choice"><input type="radio" name="experience" value="Intermediate"> Intermediate</label>
    <label class="choice"><input type="radio" name="experience" value="Advanced"> Advanced</label>

    <label for="comments">Comments or Questions:</label>
    <textarea id="comments" name="comments" rows="5" placeholder="Any comments or questions?"></textarea>

    <div class="buttons">
      <button type="submit">Register</button>
      <button type="reset">Reset</button>
    </div>
  </form>
</body>
</html>
